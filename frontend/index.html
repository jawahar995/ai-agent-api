<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveKit Agent Chat Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-dot"></span>
                <h1>LiveKit Agent Chat</h1>
            </div>
            <div class="status-indicator">
                <span id="status-dot" class="dot disconnected"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </header>

        <!-- Main Layout -->
        <main class="app-main">
            <!-- Setup Pane (glass panel) -->
            <section id="setup-pane" class="panel setup-panel">
                <div class="panel-header">
                    <h2>Connection Settings</h2>
                    <p>Enter the details to connect to the LiveKit server room.</p>
                </div>
                <form id="connect-form" class="connect-form">
                    <div class="form-group">
                        <label for="room-name">Room Name</label>
                        <input type="text" id="room-name" value="chat-test-room" required placeholder="e.g. test-room">
                    </div>
                    <div class="form-group">
                        <label for="participant-name">Participant Identity</label>
                        <input type="text" id="participant-name" value="WebClient" required placeholder="e.g. User1">
                    </div>
                    <button type="submit" id="btn-connect" class="btn btn-primary">Connect to Room</button>
                </form>
            </section>

            <!-- Chat Pane (glass panel) -->
            <section id="chat-pane" class="panel chat-panel hidden">
                <div class="chat-header">
                    <div class="room-info">
                        <h3>Room: <span id="active-room-name">...</span></h3>
                        <p>User: <span id="active-user-name">...</span></p>
                    </div>
                    <button id="btn-disconnect" class="btn btn-danger">Disconnect</button>
                </div>
                
                <!-- Messages Box -->
                <div id="messages-box" class="messages-box">
                    <div class="message system-msg">
                        <div class="msg-content">Welcome to LiveKit Agent Chat. Connecting to room...</div>
                    </div>
                </div>

                <!-- Input Box -->
                <form id="chat-form" class="chat-input-form">
                    <input type="text" id="chat-input" placeholder="Type a message..." required autocomplete="off">
                    <button type="submit" id="btn-send" class="btn btn-send">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
